<svg width="220" height="56" viewBox="0 0 220 56" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Logomark: 40×40 rounded square -->
  <rect width="40" height="40" x="0" y="8" rx="10" fill="#1E3A5F"/>
  <!-- Awning bar -->
  <rect x="7" y="15" width="26" height="5" rx="2.5" fill="white"/>
  <!-- Shop body outline -->
  <rect x="10" y="21" width="20" height="16" rx="1.5" fill="none" stroke="white" stroke-width="1.5" stroke-opacity="0.3"/>
  <!-- Receipt line 1 -->
  <line x1="13" y1="27" x2="21" y2="27" stroke="white" stroke-width="1.75" stroke-linecap="round"/>
  <!-- Receipt line 2 -->
  <line x1="13" y1="31" x2="19" y2="31" stroke="white" stroke-width="1.75" stroke-linecap="round"/>
  <!-- Payment dot -->
  <circle cx="26" cy="30" r="2.5" fill="white"/>
  <!-- Base bar -->
  <rect x="7" y="38" width="26" height="3" rx="1.5" fill="white" fill-opacity="0.35"/>

  <!-- Wordmark: "Ladenblick" -->
  <text
    x="52"
    y="36"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="26"
    font-weight="700"
    letter-spacing="-0.04em"
    fill="#1E3A5F"
  >Ladenblick</text>
</svg>
